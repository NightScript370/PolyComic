# Jack and the Beanstalk - PolyComic story definition
# The uploaded child plays the role of Jack. Style text is NOT included here;
# it is injected later from the locked style string. Every description below is
# style-neutral. Layout ids refer to app/template/layouts.yaml.
#
# Text placeholders (page `text`, subtitle and about_me strings only):
#   {name} {they} {them} {their} {theirs} {themself} {They} {Their}
#   verb helpers {is} {was} {has} {does}
#   (he/she -> is/was/has/does, they -> are/were/have/do)
# Lower-case "she"/"he"/"they" written literally in text refer to other
# characters (or a group) and are NOT substituted.
# Art fields (caption, plate_prompt, hero_instruction) call the hero
# "the hero child" so they stay name- and gender-neutral.
# The global "no text, letters, symbols or signage" rule is added by the prompt
# builder and is not repeated per page.

id: jack
title: "Jack and the Beanstalk"
hero_role: jack
hero_role_label: "as Jack"
subtitle: "starring {name} as Jack"
age_range: "4-8"
source: "public-domain English folk tale; original wording"

hero_outfit:
  id: jack_outfit
  description: >-
    A patched oatmeal-coloured linen tunic with a brown leather belt, moss-green
    trousers rolled once at the ankle, sturdy brown lace-up boots, and a small
    faded-blue cloth satchel worn across the body on a long strap.
  continuity: >-
    Identical on every page: same colours, same patches (a square tan patch on
    the left elbow and a round green patch on the right knee), satchel always on
    the left hip. Hair and face come only from the hero reference photo.

# Props are the single source of truth for objects that recur across pages. A page
# lists the ones it shows (`props: [beans]`); the image prompt gets a "Props (draw
# exactly as described, same on every page)" block and the grader checks the same
# text. Captions and must_be_visible must not contradict them. An unknown id fails
# loading. Descriptions say what the object looks like, not where it is on a page.
props:
  beans:
    description: "exactly five small magic beans, each about the size of a fingertip - one red, one yellow, one green, one blue, one purple; five beans in total, never more"
    states:
      - pages: [2]
        description: "all five beans lie together in the old man's open palm - one of each colour, none anywhere else"
      - pages: [3]
        description: "exactly four beans fly through the air in ONE clear arc from the window toward the garden, well apart from each other - one red, one yellow, one green, one blue, each colour once - none on the windowsill, none in a hand, none on the grass; exactly one purple bean lies on the doorstep right by the hero child's boot, clearly visible; five beans in total, no others anywhere"
  last_bean: "exactly one small purple magic bean, about the size of a fingertip, smooth and shiny - the purple one of the five magic beans; no other beans"
  beanstalk:
    description: "a very thick, twisting green stalk with heart-shaped leaves as big as umbrellas and curling tendrils"
    count: 1
    # What the beanstalk looks like depends on the page (whole until 16).
    states:
      - pages: [17]
        description: "being chopped down: a deep wedge-shaped notch is cut into the thick stalk near its base, pale green-white inner wood showing, wood chips flying from the cut, and the axe blade bitten deep into the notch; the stalk still stands"
      - pages: [18]
        description: "fallen: the whole stalk lies flat on the ground in ONE STRAIGHT line across the fields, like a felled tree trunk - its clean cut end lies on the ground right next to the short chopped stump in the garden, its leafy top far away across the fields; leaves crushed flat under it and a puff of dust where it landed. An arched, bent, curved-up or still-standing beanstalk is wrong"
      - pages: [19, 20]
        description: "chopped down: only a short, clean stump is left in the garden; the fallen stalk lies flat and straight across the fields far away"
  stump:
    description: "the short, clean chopped stump of the beanstalk, sticking out of the garden soil"
    count: 1
  castle:
    description: "the giant's castle - the same building on every page: an enormous pale-grey stone castle with three round towers, blue pointed cone roofs, a huge arched wooden door and small arched windows, standing on a road of firm white cloud. A castle of another colour, shape or roof is wrong"
    count: 1
  cottage:
    description: "the family's cottage - the same house on every page: a small, humble one-storey cottage with rough whitewashed stone walls, a shaggy brown thatched roof, a crooked stone chimney, small square windows with brown wooden shutters, a plain brown plank front door and a low wooden fence round a little vegetable garden. A cottage with tiles, a different roof, walls or door is wrong"
    count: 1
  golden_egg: "each golden egg is exactly the size and shape of a hen's egg, smooth and shining gold (the scene says how many)"
  axe:
    description: "a plain wood-cutting axe with a worn wooden handle"
    count: 1

# Family variants: the pipeline picks ONE variant id (fam_a..fam_d) per book,
# closest to the child's photo, and uses it for every family member.
family_variant_ids: [fam_a, fam_b, fam_c, fam_d]

characters:
  - id: mother
    name: "Mother"
    family: true
    age: 30
    description: >-
      A young mother around 30 years old, slim, with a kind, gentle, youthful
      face and smooth skin - no grey hair, no wrinkles. Her clothes are old and
      well-worn, but she is young: a faded blue headscarf tied back behind her
      hair bun with the front of her hair showing, a long, much-mended
      dusty-blue dress with a cream apron, sleeves rolled to the elbow.
    size: >-
      A grown-up woman, about one and a half times the hero child's height (the
      child's head reaches about her chest).
    variants:
      - {id: fam_a, skin_tone: "fair, light peach", hair: "straight honey-blonde hair in a loose bun"}
      - {id: fam_b, skin_tone: "light olive", hair: "wavy dark-brown hair in a loose bun"}
      - {id: fam_c, skin_tone: "warm medium brown", hair: "curly black hair gathered in a loose bun"}
      - {id: fam_d, skin_tone: "deep brown", hair: "coily black hair gathered in a round puff"}
    pages: [1, 3, 16, 17, 18, 19, 20]

  - id: milky_white
    name: "Milky-White"
    description: >-
      A gentle cream-white dairy cow with a pink nose, a soft brown patch
      around her left eye, short curved horns, and a small brass bell on a rope
      collar with a long rope lead.
    size: >-
      A full-size cow: her back is about level with the hero child's
      shoulders, and she is much longer than the child is tall.
    ref_priority: 1
    pages: [1, 2, 20]

  - id: old_man
    name: "the old man"
    description: >-
      A small, stooped old man with a long white beard, bushy white eyebrows
      and twinkly eyes, wearing a patched plum-purple cloak with the hood down
      and leaning on a crooked wooden walking stick.
    size: >-
      Small and stooped: only about a head taller than the hero child.
    ref_priority: 0
    pages: [2]

  - id: giants_wife
    name: "the giant's wife"
    description: >-
      A very tall, kind woman with rosy cheeks and grey hair in a big round
      bun, wearing a lavender dress with long sleeves, a pink apron with
      little flowers and brown clogs, holding a huge wooden spoon. Always the
      same clothes.
    size: >-
      A giant, far taller than the hero child - at least about two and a half
      times the child's height, often cut off by the frame indoors (only part
      of her may fit). The child's head reaches no higher than about her knee,
      and her hand is bigger than the child's head.
    ref_priority: 0
    pages: [7, 8]

  - id: giant
    name: "the giant"
    description: >-
      An enormous, round-bellied giant with a bushy ginger beard, a bald shiny
      head, a big round nose and wild eyebrows, wearing - always the same, on
      every page - a bottle-green waistcoat with brass buttons over a
      mustard-yellow shirt with rolled sleeves, brown knee breeches, a wide
      brown belt and big brown boots. Grumpy and silly rather than
      frightening; never carries a weapon.
    size: >-
      A giant, far taller than the hero child - standing, about three to four
      times the child's height (at least about two and a half times the
      child's height), often cut off by the frame (only his boots, legs or head and shoulders may fit). His
      head alone is much bigger than the child's head. Sitting at the table or
      far away in the distance he still looks clearly like a giant, much
      bigger than a grown-up person - never about the child's size. Each page
      anchors his size to things in its picture ('Size on this page').
    ref_priority: 0
    pages: [9, 10, 11, 12, 13, 14, 15, 18]

  - id: hen
    name: "the hen"
    description: >-
      A plump little russet-brown hen with a bright red comb, a shiny dark eye
      and fluffy cream chest feathers. Her eggs are shining gold.
    size: >-
      Small: standing, she reaches about the hero child's knee; the child can
      carry her under one arm.
    ref_priority: 2
    pages: [11, 12, 13, 14, 15, 16, 17, 18, 20]

  - id: harp
    name: "the golden harp"
    speaker_label: "Harp"
    description: >-
      A small golden lap harp with silver strings; the front pillar is carved
      into the smiling face of a lady with curly hair. When it sings, its
      strings shimmer with a soft golden glow.
    size: >-
      Small: about a third of the hero child's height, light enough to carry
      under one arm.
    ref_priority: 2
    pages: [14, 15, 16, 17, 18, 20]

pages:

  - page: 1
    layout: s01_home_two_shot
    title: "The empty cupboard"
    text: "{name} and {their} mother had nothing left to sell but Milky-White."
    caption: >-
      The hero child and their mother stand in a bare cottage kitchen beside
      an open, empty cupboard. Through the open door behind them, Milky-White
      the cow stands in the yard.
    plate_prompt: >-
      A bare, humble cottage kitchen in soft morning light: an open wooden
      cupboard with empty shelves on the left wall, a plain table with one
      empty bowl, a cold hearth. At the back, the cottage door is wide open
      and Milky-White the cow stands in the sunny yard outside, fully visible
      in the doorway. Leave two empty spaces on the bare floor where people
      would stand facing each other: one left of center in front of the
      cupboard, one right of center by the table. Bare floorboards across the
      lower third.
    hero_instruction: >-
      Insert the hero child standing left of center facing the mother. Full
      face toward the viewer, front-lit, eyes turned to look at the mother, a
      small worried frown. Arms at the sides. Wearing hero_outfit. Keep the
      hero child's head and body in the upper two-thirds of the image.
    characters: [mother, milky_white]
    expressions:
      mother: "worried and sad: a gentle frown, eyes downcast toward the empty cupboard, no smile"
    palette_note: "Morning; soft, slightly cool daylight from the doorway; muted browns and greys inside, warm sunlit yard outside."
    expression: "worried: a small frown, eyebrows drawn together, no smile"
    must_be_visible: ["hero face", "mother face", "empty cupboard", "Milky-White in the doorway", "open door"]

  - page: 2
    layout: s02_path_encounter
    speaker: old_man
    title: "The trade"
    text: "Five magic beans, said the old man. For one cow."
    speech:
      - {who: old_man, says: "Five magic beans,"}
      - {who: old_man, says: "For one cow."}
    caption: >-
      On a dirt road to market, the old man holds out exactly five small magic
      beans in his open palm - one red, one yellow, one green, one blue, one
      purple - each bean about the size of a fingertip. The hero child holds
      Milky-White's rope.
    plate_prompt: >-
      A winding dirt road through green fields on the way to market, a wooden
      fence and a distant village in the background, wide calm sky across the
      top fifth. The old man stands right of center facing left, one arm
      stretched out, palm open and turned up, showing exactly five small
      shiny beans - one red, one yellow, one green, one blue, one purple -
      each about the size of a fingertip, all five fitting easily in his palm. Milky-White stands at the left
      edge, her rope lead trailing toward the center. Leave an empty space
      left of center, between the cow and the old man, where a small person
      would stand.
    hero_instruction: >-
      Insert the hero child standing between Milky-White and the old man,
      three-quarter view turned toward the old man, holding Milky-White's rope
      in one hand. Curious, wide-eyed expression, leaning forward slightly to
      look at the small beans in the old man's palm. Same clothes as page 1
      (hero_outfit).
    characters: [old_man, milky_white]
    expressions:
      old_man: "kind and mysterious: a twinkly-eyed little smile, eyebrows raised"
    props: [beans]
    palette_note: "Late morning; bright, clear daylight; pale blue sky, green fields, warm dirt road."
    expression: "curious and wide-eyed: eyebrows raised, mouth slightly open"
    must_be_visible: ["hero face", "old man face", "exactly five small beans (red, yellow, green, blue, purple; each about the size of a fingertip) in his palm", "Milky-White", "the rope"]

  - page: 3
    layout: s03_dusk_consequence
    speaker: mother
    portrait: moment
    portrait_expression: angry
    title: "Out the window"
    text: "Beans! she cried. And out the window they went."
    speech:
      - {who: mother, says: "Beans!"}
    caption: >-
      The cottage at dusk. The mother has thrown the five small beans from the
      window and the five beans scatter: exactly four small beans (red,
      yellow, green, blue) in the air between the window and the garden, and
      exactly one small purple bean on the doorstep by the hero child's boot -
      the purple one. Five beans in total, no others anywhere in the picture.
      The hero child stands at the doorway, watching.
    art_caption: >-
      The outside of the cottage at dusk. In the open window at the upper
      left, the mother leans out with one arm stretched toward the garden -
      she has just thrown the beans and her hand is empty. Exactly four small
      beans (one red, one yellow, one green, one blue), well apart, fly in ONE
      clear arc from her hand down toward the garden. The hero child stands
      in the open front door at the lower right, watching, and exactly one
      small purple bean lies on the doorstep right by the hero child's boot.
      Five beans in total: none on the windowsill, none on the grass, none in
      anyone's hand.
    plate_prompt: >-
      The outside of the small cottage at dusk, seen from the garden. An
      upper-left window is thrown open, lit warm from inside, with an empty
      space in it where a person would lean out with one arm stretched toward
      the garden. Exactly four small beans - one red, one yellow, one green,
      one blue, each about the size of a fingertip and well apart from each
      other - fly in one clear arc from the window down toward the garden;
      nothing on the windowsill. The front door at the lower right is open
      with warm light spilling out, and exactly one small purple bean lies on
      the doorstep. Five beans in total, no others anywhere. Leave the doorway
      empty where a small person would stand and watch. The lower fifth is
      dark grass in shadow, painted right to the bottom edge.
    hero_instruction: >-
      Insert the hero child standing in the open doorway at the lower right,
      three-quarter view, looking up and left at the flying beans, mouth open
      in surprise, one hand on the door frame, both hands empty. Back-lit by
      the warm doorway light with a soft rim, face still clearly readable.
      Wearing hero_outfit. Exactly one small purple bean, about the size of a
      fingertip, lies on the doorstep right by the hero child's boot.
    characters: [mother]
    expressions:
      mother: "cross and exasperated: eyebrows drawn down, mouth open as she cries out, a comical huff - never scary"
    props: [beans, cottage]
    palette_note: "Dusk; noticeably darker than pages 1-2: deep blue-violet sky with a last orange glow, warm window and doorway light, dark green grass."
    expression: "surprised: eyes wide, eyebrows up, mouth open"
    must_be_visible: ["hero face", "mother at the window, arm stretched out", "exactly four small beans (red, yellow, green, blue) flying in one arc from the window toward the garden", "exactly one small purple bean on the doorstep by the hero child's boot: five beans in total, no others", "garden below the window"]

  - page: 4
    layout: s04_wonder_wide
    title: "The beanstalk at dawn"
    text: "In the morning, something enormous stood in the garden. A beanstalk, growing up, up, up into the clouds!"
    caption: >-
      At dawn, a giant beanstalk rises from the garden where the beans fell,
      twisting up past the cottage roof and into the clouds. The hero child
      stands small at its foot, looking up.
    plate_prompt: >-
      Wide view of the cottage garden at dawn. A giant beanstalk with
      umbrella-sized heart-shaped leaves bursts from the soil left of center
      and twists upward, past the cottage roof, until it disappears into
      pink-gold clouds at the top of the frame. Dew glistens on the leaves.
      The cottage sits small on the right. Leave an empty space at the
      lower-left, at the foot of the beanstalk, where a small person would
      stand looking up. Keep the top-right corner as plain soft dawn sky.
    hero_instruction: >-
      Insert the hero child small in frame at the lower-left by the base of
      the beanstalk, head tilted back to look up, face turned so it is still
      visible, mouth open in amazement, both hands raised. Wearing hero_outfit.
    characters: []
    props: [beanstalk, cottage]
    palette_note: "Dawn; pink and gold light from the right, long soft shadows, fresh greens."
    expression: "amazed: eyes wide, mouth open in wonder"
    must_be_visible: ["hero face", "beanstalk base", "beanstalk rising into clouds", "cottage"]

  - page: 5
    layout: s05_vertical_ascent
    title: "Climbing the beanstalk"
    text: "{name} took a deep breath and began to climb. Leaf by leaf {they} went, higher than the birds."
    caption: >-
      The hero child climbs the beanstalk, high above the cottage. Little
      birds fly below and the cottage roof is tiny far beneath, just above the
      misty bottom fifth.
    plate_prompt: >-
      Tall vertical view along the beanstalk: the thick twisting stalk runs
      from the bottom of the frame to the top, big leaves sticking out like
      steps. Far below, in the lower third of the picture but just above the
      bottom fifth, the cottage roof and garden are tiny in soft morning
      mist; a few small birds fly beneath the middle of the stalk. Above, the
      stalk vanishes into bright clouds. Leave an empty space at the middle of
      the stalk where a small climbing figure would be. Keep the bottom fifth
      as plain soft mist and distant fields.
    hero_instruction: >-
      Insert the hero child climbing the stalk at mid-frame, both hands
      gripping a leaf stem above, one boot on a leaf below. Three-quarter view
      looking back over the shoulder toward the viewer with a determined,
      excited smile. Satchel swinging. Wearing hero_outfit.
    characters: []
    props: [beanstalk, cottage]
    palette_note: "Early morning; clear bright light, the cottage below still misty."
    expression: "determined and excited: a determined smile"
    must_be_visible: ["hero face", "beanstalk", "tiny cottage far below", "birds"]

  - page: 6
    layout: s06_arrival_wide
    title: "The castle in the clouds"
    text: "At the very top, on a road made of clouds, stood the biggest castle {name} had ever seen."
    caption: >-
      Above the clouds, an enormous castle stands at the end of a road of
      white cloud. The hero child has just stepped off the top of the
      beanstalk.
    plate_prompt: >-
      A bright land above the clouds: a firm road of white cloud leads from
      the lower-left to an enormous pale-stone castle with round towers and
      blue pointed roofs filling the upper two-thirds. The tip of the
      beanstalk curls up out of the clouds at the lower-left. Clear blue sky.
      Leave an empty space in the lower-left foreground beside the beanstalk
      tip where a small person would stand. Keep the bottom-right as plain
      flat cloud.
    hero_instruction: >-
      Insert the hero child small in the lower-left foreground, just stepped
      off the beanstalk, three-quarter view turned toward the castle, face
      visible, eyes wide with wonder. Wearing hero_outfit.
    characters: []
    props: [beanstalk, castle]
    palette_note: "Midday above the clouds; bright, airy whites and sky blues, warm sunlight on the castle stone."
    expression: "full of wonder: eyes wide, mouth slightly open"
    must_be_visible: ["hero face", "castle", "cloud road", "beanstalk tip"]

  - page: 7
    layout: s07_threshold_meeting
    speaker: giants_wife
    title: "The giant's wife"
    text: "A giant woman opened the door. You look hungry, she said kindly. Come in, quick!"
    speech:
      - {who: giants_wife, says: "You look hungry,"}
      - {who: giants_wife, says: "Come in, quick!"}
    caption: >-
      At the castle's enormous wooden door, the giant's wife bends down and
      smiles at the hero child, holding out a giant crust of bread.
    plate_prompt: >-
      An enormous arched wooden castle door standing open. The giant's wife
      fills the right half of the frame, bending low with a kind smile, one
      huge hand holding out a crust of bread as big as a pillow. Her wooden
      spoon is tucked in her apron. Warm kitchen light glows behind her. Leave
      an empty space on the left side of the threshold where a small person
      would stand facing into the doorway. Keep the top fifth as plain stone
      lintel.
    hero_instruction: >-
      Insert the hero child standing at the left of the threshold,
      three-quarter view turned toward the giant's wife, looking up, a shy
      hopeful smile, one hand reaching for the bread. Tiny next to her.
      Wearing hero_outfit.
    characters: [giants_wife]
    expressions:
      giants_wife: "kind and welcoming: a warm, gentle smile, eyebrows soft"
    palette_note: "Midday outside, warm amber kitchen light from inside the door."
    expression: "shy and hopeful: a small shy smile"
    must_be_visible: ["hero face", "giant's wife face", "bread", "doorway"]

  - page: 8
    layout: s08_interior_secret
    speaker: giants_wife
    title: "Hide!"
    text: "Then the floor began to shake. Hide! she whispered, and {name} slipped into a cupboard, just like the one at home."
    speech:
      - {who: giants_wife, says: "Hide!"}
    caption: >-
      In the giant's huge kitchen, the giant's wife holds a cupboard door open
      while the hero child climbs inside. Cups on the table tip and wobble as
      the floor shakes.
    plate_prompt: >-
      Inside the giant's enormous kitchen: a table as big as a house, giant
      cups and plates, a crackling fireplace. On the right, a tall wooden
      cupboard stands with its lower door open and its shelf empty. The
      giant's wife stands beside it, one finger to her lips, glancing over her
      shoulder toward a doorway at the left. On the table a giant cup is
      tipping over and a spoon is sliding off the edge. Leave the inside of
      the open cupboard empty, with room for a small person climbing in. Keep
      the top fifth as plain ceiling beams.
    hero_instruction: >-
      Insert the hero child half inside the open cupboard on the right,
      three-quarter view, looking back toward the viewer with wide, nervous
      eyes and no smile, one hand on the cupboard door. Wearing hero_outfit.
    characters: [giants_wife]
    expressions:
      giants_wife: "urgent and worried: one finger to her lips, eyebrows raised, glancing over her shoulder - no smile"
    palette_note: "Interior; warm amber firelight from the left, cosy shadows."
    expression: "nervous: eyes wide, eyebrows raised, mouth pressed shut - no smile"
    must_be_visible: ["hero face", "giant's wife", "open cupboard", "giant table and cups"]

  - page: 9
    layout: s09_low_angle_reveal
    speaker: giant
    title: "Fee-fi-fo-fum"
    text: "Fee-fi-fo-fum! boomed the giant. I smell somebody new!"
    speech:
      - {who: giant, says: "Fee-fi-fo-fum!"}
      - {who: giant, says: "I smell somebody new!"}
    caption: >-
      Seen from below, the giant stomps into the kitchen, sniffing the air
      with his big round nose. The hero child watches from the crack of the
      cupboard in the corner.
    plate_prompt: >-
      Low-angle view across the kitchen floor: the giant fills the upper and
      middle frame, mid-stomp, leaning forward and sniffing the air with his
      eyes squeezed shut and his nose wrinkled, a comic rather than scary
      pose. In the lower-left corner, the cupboard door is open just a crack,
      with an empty gap where a face would peek out in profile. Keep the
      bottom-right as plain stone floor.
    hero_instruction: >-
      Insert the hero child small in the lower-left, peeking out through the
      cupboard crack in profile, looking up at the giant, frightened: eyes
      very wide, eyebrows raised and worried, mouth pressed shut, no smile,
      both hands pressed to the door edge. Wearing hero_outfit.
    characters: [giant]
    expressions:
      giant: "comically sniffing: eyes squeezed shut, big nose wrinkled and lifted, cheeks puffed - silly, not menacing"
    sizes:
      giant: "seen from below he towers over the kitchen, his head up near the ceiling beams - about four times the hero child's height; the child peeking from the cupboard is no taller than his boot and lower leg"
    palette_note: "Interior; firelight from below casting warm light up on the giant, cosy rather than menacing."
    expression: "frightened, the way a picture-book child is frightened (not horror): eyes very wide, eyebrows raised and worried, mouth pressed shut or slightly open, shrinking back - no smile"
    must_be_visible: ["hero face", "giant face", "cupboard"]

  - page: 10
    layout: s10_closeup_reaction
    title: "Very, very still"
    text: "{name} peeked through the crack in the door. {They} held {their} breath and stayed very, very still."
    caption: >-
      Close-up of the hero child's face peeking through the narrow gap of the
      cupboard door, holding their breath; the face sits in the middle band
      of the picture, well clear of the top and bottom fifths. The giant's big
      blurry boot is in the background, low at one side.
    art_caption: >-
      Close-up of the hero child's face peeking through the narrow gap of the
      cupboard door, holding their breath; the face sits in the middle band
      of the picture, well clear of the top and bottom fifths. The giant's big
      boot is in the dim background, low at one side. The whole picture is
      painted crisply in the same style, edge to edge - no blurred or smeared
      areas.
    plate_prompt: >-
      Close-up through a narrow gap between two wooden cupboard doors: the
      inside edge of each door frames the center of the image. Beyond the gap,
      in dim light, a giant's huge boot low at the right and the leg of a
      table, painted crisply in the same style (no blur). Leave the middle band of the frame empty where a face would peek
      through the gap. The top fifth is the dark wooden top of the cupboard
      doorway in soft shadow, painted right to the top edge; the lower fifth
      is the dark wood of the doors and the cupboard floor.
    hero_instruction: >-
      Insert the hero child's face in the middle band of the frame between the
      cupboard doors: eyes a little above the center of the picture, the top
      of the head below the top fifth and the chin well above the bottom
      fifth (the face takes up about a third of the picture's height, not
      more). Full face toward the viewer, eyes very wide, cheeks puffed from
      holding their breath, fingers curled on a door edge at chin height.
      Collar of hero_outfit visible.
    characters: [giant]
    sizes:

<div class="field">
  <span class="label" id="photo-label">1. Photo</span>
  <div class="dropzone" id="dropzone">
    <input type="file" id="photo" name="photo" accept="image/png,image/jpeg,image/webp" aria-labelledby="photo-label" aria-describedby="photo-help">
    <img id="thumb" alt="Selected photo preview" hidden>
    <p id="photo-help" class="drop-text">Drop a photo here or <u>browse</u><br><small>PNG, JPEG or WebP, up to 10 MB</small></p>
  </div>
</div>

<fieldset class="field">
  <legend class="label">2. Style</legend>
  <div class="cartridges" id="styles" role="radiogroup" aria-label="Style"></div>
</fieldset>

<div class="field">
  <label class="label" for="detail">3. Detail: <span id="detail-name">Classic</span></label>
  <input type="range" id="detail" name="detail" min="1" max="3" step="1" value="2" aria-valuetext="Classic">
  <div class="ticks" aria-hidden="true"><span>Chunky</span><span>Classic</span><span>Refined</span></div>
</div>

<div id="state-error" class="state" data-state="error" hidden>
  <div class="rpg-box" role="alert">
    <p class="rpg-name">SYSTEM</p>
    <p id="error-text" class="rpg-text">Something went wrong.</p>
    <div class="rpg-actions">
      <a class="pill small" id="error-signin" href="/auth/login" hidden>SIGN IN</a>
      <a class="pill small" id="error-funds" href="/wallet" hidden>ADD FUNDS</a>
      <button type="button" class="pill small ghost" id="error-dismiss">OK</button>
    </div>
  </div>
</div>

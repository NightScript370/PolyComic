services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: ${PORT:-7659}
      DATABASE_URL: postgresql+asyncpg://polycomic:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/polycomic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-7659}:${PORT:-7659}"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: polycomic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: polycomic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polycomic -d polycomic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
